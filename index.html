<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Time Clock</title>
<style>
:root{
  --bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;
  --green:#14804a;--green-bg:#e7f6ee;--red:#c0362c;--red-bg:#fdecea;
  --amber:#a35b00;--amber-bg:#fff4e0;--blue:#1d4ed8;--radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1115;--card:#181b21;--ink:#eef0f3;--mute:#9aa1ad;--line:#2a2e36;
  --green:#3fcf85;--green-bg:#123122;--red:#ff6b5f;--red-bg:#3a1714;
  --amber:#ffb54a;--amber-bg:#3a2a10;--blue:#7aa2ff;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.wrap.wide{max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 18px}
.brand{font-weight:700;font-size:20px}
.sub{color:var(--mute);font-size:14px}
.small{font-size:12px}
.clock{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.idbtn{padding:22px 10px;font-size:20px;font-weight:700;letter-spacing:.5px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);color:var(--ink);cursor:pointer}
.idbtn:active{transform:scale(.98)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
.card.center{align-items:center;text-align:center;padding:40px 22px}
.narrow{max-width:380px;margin:40px auto}
.who{font-size:26px;font-weight:800;text-align:center}
.state{text-align:center;padding:8px 12px;border-radius:999px;background:var(--bg);color:var(--mute);font-weight:600}
.state.on{background:var(--green-bg);color:var(--green)}
.big{border:0;border-radius:var(--radius);padding:20px;font-size:20px;font-weight:800;color:#fff;cursor:pointer;width:100%}
.big.in{background:var(--green)}.big.out{background:var(--red)}
.big:disabled{opacity:.6}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.ghost{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:transparent;color:var(--ink);font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:15px;text-align:center}
a{color:var(--blue)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.pin{text-align:center;font-size:22px;letter-spacing:6px}
.alert{border-radius:10px;padding:12px 14px;font-size:15px}
.alert.err{background:var(--red-bg);color:var(--red)}
.alert.warn{background:var(--amber-bg);color:var(--amber)}
.alert.ok{background:var(--green-bg);color:var(--green)}
.demo{margin-bottom:14px}
.tick{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:46px;color:#fff;background:var(--green)}
.done.out .tick{background:var(--red)}
.done h2{margin:0;font-size:28px}
.warnline{color:var(--amber);font-weight:600}
footer{text-align:center;margin-top:28px}
footer a{color:var(--mute);font-size:13px}
.spinner{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.tabs button.act{background:var(--ink);color:var(--bg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.stats b{display:block;font-size:26px}.stats span{color:var(--mute);font-size:13px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.ecard{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px}
.ecard.on{border-left-color:var(--green)}
.eid{font-weight:800;font-size:17px}
.est{font-weight:800;font-size:13px;color:var(--mute)}.ecard.on .est{color:var(--green)}
.emeta{font-size:13px;color:var(--mute)}
.flag{display:inline-block;margin-top:4px;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:999px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px;min-width:140px;flex:1}
.filters button{height:44px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;font-size:14px}
.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:18px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--mute)}
.badge.ok{background:var(--green-bg);color:var(--green)}
.badge.bad{background:var(--red-bg);color:var(--red)}
.badge.warn{background:var(--amber-bg);color:var(--amber)}
.set section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.set h3{margin:0}
.set label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute)}
.set label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.set label.chk input{width:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
.pinrow{display:grid;grid-template-columns:90px 80px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pinrow:last-child{border-bottom:0}
.devrow{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.devrow:last-child{border-bottom:0}
.flag.red{color:var(--red);background:var(--red-bg)}
@media (max-width:520px){.pinrow{grid-template-columns:1fr 1fr}.clock{font-size:22px}}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.langs button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.langs button.act{background:var(--ink);color:var(--bg)}
.ltr{direction:ltr;unicode-bidi:isolate}
[dir=rtl] body{font-family:system-ui,"Segoe UI","Noto Sans Arabic",Tahoma,sans-serif}
[dir=rtl] .ecard{border-left:1px solid var(--line);border-right:5px solid var(--line)}
[dir=rtl] .ecard.on{border-right-color:var(--green)}
.tbl th,.tbl td{text-align:start}
</style>
</head>

   (Firebase console → Project settings → Your apps → Web app)
   While apiKey is "YOUR_API_KEY" the app runs in DEMO MODE
   (data stays on this one device only).
   ========================================================= */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyArumq8TusHJNDwsG5TTFASHq2tOYcrwg8",
  authDomain: "dsp-hours.firebaseapp.com",
  projectId: "dsp-hours",
  storageBucket: "dsp-hours.firebasestorage.app",
  messagingSenderId: "990664937035",
  appId: "1:990664937035:web:d29dd9d5e960ded9eb87ce"
};

const MODE = "employee"; // "employee" (index.html) or "admin" (admin.html)

const DEFAULT_EMPLOYEES = ["LUAB01","ALMO03","AHRA06","ABRE07","ALAH08","ALMU10","MOMO13","KHIB15","ALBA18","ABQA23"];

/* ---------------- data layer ---------------- */
const DEMO = FIREBASE_CONFIG.apiKey === "YOUR_API_KEY" || typeof firebase === "undefined";
let fs = null;
if (!DEMO) { firebase.initializeApp(FIREBASE_CONFIG); fs = firebase.firestore(); }

const LS = {
  get(k, d) { try { const v = JSON.parse(localStorage.getItem("tc_" + k)); return v ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("tc_" + k, JSON.stringify(v)); } catch {} }
};

const DB = {
  async getSettings() {
    const def = { shopName: "Shop", employees: DEFAULT_EMPLOYEES.slice(), shop: null, radius: 100, enforce: true, deviceLock: true, adminHash: null, pins: {} };
    let s = null;
    if (DEMO) s = LS.get("settings", null);
    else { const d = await fs.collection("timeclock_settings").doc("main").get(); s = d.exists ? d.data() : null; }
    const out = Object.assign(def, s || {});
    out.pins = out.pins || {};
    return out;
  },
  async saveSettings(s) {
    if (DEMO) LS.set("settings", s);
    else await fs.collection("timeclock_settings").doc("main").set(s);
  },
  async getStatus(emp) {
    if (DEMO) return LS.get("status", {})[emp] || null;
    const d = await fs.collection("timeclock_status").doc(emp).get();
    return d.exists ? d.data() : null;
  },
  async allStatus() {
    if (DEMO) return LS.get("status", {});
    const q = await fs.collection("timeclock_status").get();
    const o = {}; q.forEach(d => o[d.id] = d.data()); return o;
  },
  async punch(p, updateStatus) {
    if (DEMO) {
      const a = LS.get("punches", []); a.push({ ...p, id: String(Date.now()) }); LS.set("punches", a);
      if (updateStatus) { const st = LS.get("status", {}); st[p.emp] = { ...(st[p.emp] || {}), state: p.type, t: p.t, inside: p.inside, device: p.deviceId }; LS.set("status", st); }
      return;
    }
    const batch = fs.batch();
    batch.set(fs.collection("timeclock_punches").doc(), { ...p, serverTime: firebase.firestore.FieldValue.serverTimestamp() });
    if (updateStatus) batch.set(fs.collection("timeclock_status").doc(p.emp), { state: p.type, t: p.t, inside: p.inside, device: p.deviceId }, { merge: true });
    await batch.commit();
  },
  async setDevice(emp, dev) {
    if (DEMO) { const st = LS.get("status", {}); st[emp] = { ...(st[emp] || {}), device: dev }; LS.set("status", st); return; }
    await fs.collection("timeclock_status").doc(emp).set({ device: dev }, { merge: true });
  },
  async punches(from, to) {
    if (DEMO) return LS.get("punches", []).filter(p => p.t >= from && p.t < to).sort((a, b) => a.t - b.t);
    const q = await fs.collection("timeclock_punches").where("t", ">=", from).where("t", "<", to).orderBy("t").get();
    return q.docs.map(d => ({ id: d.id, ...d.data() }));
  }
};

async function sha(s) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}

    try { localStorage.setItem("tc_device", id); } catch {}
  }
  return id;
}
function lockLeft() { const f = LS.get("fails", { n: 0, until: 0 }); return f.until > Date.now() ? f.until - Date.now() : 0; }

}

  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error(t("gps_unsupported")));
    navigator.geolocation.getCurrentPosition(
      p => res(p.coords),
      e => rej(new Error(e.code === 1 ? t("gps_denied") : e.code === 3 ? t("gps_timeout") : t("gps_fail"))),

function distM(a, b) {

}
function calcHours(ps, now) {
  const r = {}, open = {};
  ps.filter(p => p.type === "in" || p.type === "out").sort((a, b) => a.t - b.t).forEach(p => {
    r[p.emp] = r[p.emp] || { ms: 0, open: false, shifts: 0 };
    if (p.type === "in") { open[p.emp] = p.t; r[p.emp].shifts++; }
    else if (open[p.emp] != null) { r[p.emp].ms += p.t - open[p.emp]; open[p.emp] = null; }

function empView() {
  clearTimeout(resetTimer);
  app.innerHTML = `<div class="wrap">
    ${langBar()}
    <header class="top"><div><div class="brand">${esc(S.shopName)} · ${t("title_clock")}</div><div class="sub">${t("enter_id_pin")}</div></div><div class="clock ltr" id="clk"></div></header>

      <input id="epin" class="pin" dir="ltr" type="password" inputmode="numeric" maxlength="8" placeholder="${t("pin")}" autocomplete="off">
      <button class="big in" type="submit" id="lb">${t("continue")}</button>
      <div id="msg"></div>
    </form>
    <footer><span class="sub small">${t("this_phone")}: ${shortDev(deviceId())}</span></footer></div>`;
  bindLang(empView);
  $("#lf").onsubmit = async ev => {
    ev.preventDefault();
    const m = $("#msg"), lb = $("#lb");
    const reset = () => { lb.disabled = false; lb.textContent = t("continue"); };
    const left = lockLeft();
    if (left) { m.innerHTML = alertBox("err", t("too_many", { n: Math.ceil(left / 60000) })); return; }
    const emp = $("#eid").value.trim().toUpperCase(), pin = $("#epin").value.trim();
    if (!emp || !pin) { m.innerHTML = alertBox("err", t("enter_both")); return; }
    lb.disabled = true; lb.textContent = t("checking");
    try { S = await DB.getSettings(); } catch { reset(); m.innerHTML = alertBox("err", t("no_conn")); return; }
    const known = S.employees.includes(emp);
    if (known && !S.pins[emp]) { reset(); m.innerHTML = alertBox("warn", t("pin_not_set")); return; }
    if (!known || await sha(emp + ":" + pin) !== S.pins[emp]) {
      failAttempt(); $("#epin").value = ""; reset();
      m.innerHTML = alertBox("err", t("wrong_id_pin")); return;

async function empStep(emp) {
  app.innerHTML = `<div class="wrap"><div class="card center"><div class="spinner"></div><p class="sub">${t("loading")}</p></div></div>`;
  let st = null;
  try { S = await DB.getSettings(); st = await DB.getStatus(emp); }
  catch (e) { app.innerHTML = `<div class="wrap">${alertBox("err", t("no_conn"))}</div>`; resetTimer = setTimeout(empView, 3000); return; }
  const next = st && st.state === "in" ? "out" : "in";
  app.innerHTML = `<div class="wrap"><div class="card">
    <div class="who ltr">${esc(emp)}</div>
    <div class="state ${next === "out" ? "on" : ""}">${next === "out" ? t("in_since", { t: fmtWhen(st.t) }) : t("currently_out")}</div>
    <button id="go" class="big ${next}">${next === "in" ? t("clock_in") : t("clock_out")}</button>
    <div id="msg"></div>
    <button id="back" class="link">${t("cancel_logout")}</button>
  </div></div>`;
  $("#back").onclick = empView;
  $("#go").onclick = () => doPunch(emp, next);
  resetTimer = setTimeout(empView, 60000);
}

async function doPunch(emp, type) {
  const go = $("#go"), msg = $("#msg"), label = type === "in" ? t("clock_in") : t("clock_out");
  const fail = html => { msg.innerHTML = html; go.disabled = false; go.textContent = label; };
  clearTimeout(resetTimer); resetTimer = setTimeout(empView, 60000);

  if (!S.shop) return fail(alertBox("warn", t("shop_not_set")));

  go.disabled = true; go.textContent = t("checking_loc"); msg.innerHTML = "";
  let c;
  try { c = await getPos(); } catch (e) { return fail(alertBox("err", esc(e.message))); }

  const d = Math.round(distM(S.shop, { lat: c.latitude, lng: c.longitude }));
  const inside = d <= S.radius;
  const dev = deviceId();
  const rec = {
    emp, type, t: Date.now(),
    lat: +c.latitude.toFixed(6), lng: +c.longitude.toFixed(6),
    acc: Math.round(c.accuracy), dist: d, inside,
    deviceId: dev, device: navigator.userAgent.slice(0, 160)
  };
  const reject = async (reason, html) => {
    try { await DB.punch({ ...rec, type: "rejected_" + type, reason }, false); } catch {}
    fail(alertBox("err", html));
  };

  if (S.deviceLock) {
    let all;
    try { all = await DB.allStatus(); } catch { return fail(alertBox("err", t("no_conn"))); }
    const mine = all[emp]?.device;
    if (mine && mine !== dev) return reject("other_device", t("wrong_phone", { e: esc(emp) }));
    if (Object.keys(all).some(e => e !== emp && all[e]?.device === dev)) return reject("device_taken", t("phone_taken"));
  }

  if (!inside && S.enforce) {
    const accNote = rec.acc > S.radius ? `<br><small>${t("weak_gps", { a: rec.acc })}</small>` : "";
    return reject("outside", t("too_far", { d, r: S.radius }) + accNote);
  }

  go.textContent = t("saving");
  try { await DB.punch(rec, true); }
  catch (e) { return fail(alertBox("err", t("save_fail"))); }

  app.innerHTML = `<div class="wrap"><div class="card center done ${type}">
    <div class="tick">✓</div>
    <h2>${type === "in" ? t("done_in") : t("done_out")}</h2>
    <div class="who">${ltr(esc(emp) + " · " + fmtT(rec.t))}</div>
    ${!inside ? `<p class="warnline">${t("done_outside")}</p>` : ""}
    <p class="sub">${t("done_note")}</p>
  </div></div>`;
  resetTimer = setTimeout(empView, 4000);
}

function adminShell() {
  clearInterval(liveTimer);
  const np = S.employees.filter(e => !S.pins[e]);
  app.innerHTML = `<div class="wrap wide">
    ${langBar()}
    <header class="top"><div><div class="brand">${t("admin_center")}</div><div class="sub">${esc(S.shopName)}${DEMO ? " · " + t("demo_mode") : ""}</div></div>
      <div><button class="ghost" id="lo">${t("logout")}</button></div></header>
    ${!S.shop ? alertBox("warn", t("set_loc_warn")) + "<br>" : ""}
    ${np.length ? alertBox("warn", t("no_pin_warn", { n: np.length, list: ltr(np.map(esc).join(", ")) })) + "<br>" : ""}
    <nav class="tabs">${[["live", t("tab_live")], ["rec", t("tab_rec")], ["set", t("tab_set")]].map(([k, l]) => `<button data-t="${k}" class="${adminTab === k ? "act" : ""}">${l}</button>`).join("")}</nav>
    <div id="pane"><div class="spinner"></div></div></div>`;
  bindLang(adminShell);
  app.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { adminTab = b.dataset.t; adminShell(); });
  $("#lo").onclick = () => { try { sessionStorage.removeItem("tc_admin"); } catch {} adminLogin(); };
  if (adminTab === "live") live(); else if (adminTab === "rec") records(); else settingsPane();
}

async function live() {
  const pane = $("#pane"); if (!pane) return;
  let st, today;
  try {
    const t0 = dayStart(Date.now());
    [st, today] = await Promise.all([DB.allStatus(), DB.punches(t0, nextDay(t0))]);
  } catch (e) { pane.innerHTML = alertBox("err", t("load_fail") + esc(e.message)); return; }
  const hrs = calcHours(today, Date.now());
  const inCount = S.employees.filter(e => st[e]?.state === "in").length;
  const flags = today.filter(p => !p.inside || p.type.startsWith("rejected")).length;
  const shared = sharedPhones(today);
  const sharedEmps = new Set(Object.values(shared).flat());
  pane.innerHTML = `${sharedAlert(shared)}
    <div class="stats"><div><b>${inCount}</b><span>${t("in_now")}</span></div><div><b>${S.employees.length - inCount}</b><span>${t("out_now")}</span></div><div><b>${flags}</b><span>${t("flags_today")}</span></div></div>
    <div class="board">${S.employees.map(e => {
      const s = st[e], on = s?.state === "in";
      return `<div class="ecard ${on ? "on" : ""}">
        <div class="eid ltr">${esc(e)}</div><div class="est">${on ? t("st_in") : t("st_out")}</div>
        <div class="emeta">${s ? (on ? t("since", { t: fmtWhen(s.t) }) : t("last_out", { t: fmtWhen(s.t) })) : t("no_records")}</div>
        <div class="emeta">${t("today_h", { h: fmtH(hrs[e]?.ms || 0) })}${hrs[e]?.open ? t("running") : ""}</div>
        ${s && !s.inside ? `<span class="flag">${t("flag_outside")}</span>` : ""}
        ${sharedEmps.has(e) ? `<span class="flag red">${t("flag_shared")}</span>` : ""}
      </div>`; }).join("")}</div>
    <p class="sub small">${t("refresh_note", { t: ltr(fmtT(Date.now())) })} · <button class="link" id="rf" style="font-size:12px">${t("refresh_now")}</button></p>`;
  clearInterval(liveTimer);
  liveTimer = setInterval(() => { if (adminTab === "live" && $("#pane")) live(); else clearInterval(liveTimer); }, 120000);
  const rf = $("#rf"); if (rf) rf.onclick = live;
}

function rejReason(p) { return { outside: t("r_outside"), other_device: t("r_other"), device_taken: t("r_taken") }[p.reason] || t("r_outside"); }
function statusText(p) { return p.type.startsWith("rejected") ? t("rej", { r: rejReason(p) }) : p.inside ? t("at_shop") : t("outside"); }
function statusBadge(p) {
  const cls = p.type.startsWith("rejected") ? "bad" : p.inside ? "ok" : "warn";
  return `<span class="badge ${cls}">${statusText(p)}</span>`;
}
function actionLabel(x) { return x === "in" ? t("a_in") : x === "out" ? t("a_out") : x === "rejected_in" ? t("a_rin") : t("a_rout"); }

function records() {
  const pane = $("#pane"), today = isoDay(Date.now());
  pane.innerHTML = `<div class="filters">
      <label>${t("from")}<input type="date" id="f" value="${recF || today}"></label>
      <label>${t("to")}<input type="date" id="tt" value="${recT || today}"></label>
      <label>${t("employee")}<select id="fe"><option value="">${t("all_emps")}</option>${S.employees.map(e => `<option value="${esc(e)}" ${recE === e ? "selected" : ""}>${esc(e)}</option>`).join("")}</select></label>
      <button id="ld" class="btn">${t("show")}</button><button id="csv" class="ghost">${t("export")}</button>
    </div><div id="res"></div>`;
  const load = async () => {
    recF = $("#f").value; recT = $("#tt").value; recE = $("#fe").value;
    const from = new Date(recF + "T00:00").getTime(), to = nextDay(new Date(recT + "T00:00").getTime());
    const res = $("#res"); res.innerHTML = `<div class="spinner"></div>`;
    let ps;
    try { ps = await DB.punches(from, to); } catch (e) { res.innerHTML = alertBox("err", esc(e.message)); return; }
    if (recE) ps = ps.filter(p => p.emp === recE);
    lastRows = ps;
    const shared = sharedPhones(ps);
    const hrs = calcHours(ps, to > Date.now() ? Date.now() : null);
    const emps = recE ? [recE] : S.employees;
    res.innerHTML = `${sharedAlert(shared)}<h3>${t("hours")}</h3><div class="scroll"><table class="tbl"><thead><tr><th>${t("employee")}</th><th>${t("hours")}</th><th>${t("shifts")}</th><th>${t("loc_flags")}</th></tr></thead><tbody>
      ${emps.map(e => { const h = hrs[e]; const f = ps.filter(p => p.emp === e && !p.inside).length;
        return `<tr><td><b class="ltr">${esc(e)}</b></td><td>${fmtH(h?.ms || 0)}${h?.open ? ` <span class="badge warn">${to > Date.now() ? t("still_in") : t("no_out")}</span>` : ""}</td><td>${h?.shifts || 0}</td><td>${f ? `<span class="badge warn">${f}</span>` : "–"}</td></tr>`; }).join("")}
      </tbody></table></div>
      <h3>${t("all_entries", { n: ps.length })}</h3>
      ${ps.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>${t("date")}</th><th>${t("time")}</th><th>${t("employee")}</th><th>${t("action")}</th><th>${t("coords")}</th><th>${t("distance")}</th><th>${t("accuracy")}</th><th>${t("phone")}</th><th>${t("status")}</th><th>${t("map")}</th></tr></thead><tbody>
      ${ps.slice().reverse().map(p => `<tr><td>${ltr(fmtD(p.t))}</td><td>${ltr(fmtT(p.t))}</td><td><b class="ltr">${esc(p.emp)}</b></td><td>${actionLabel(p.type)}</td><td>${ltr(p.lat + ", " + p.lng)}</td><td>${p.dist} ${t("m")}</td><td>±${p.acc} ${t("m")}</td><td>${shortDev(p.deviceId)}${shared[p.deviceId] ? ` <span class="badge bad">${t("shared_b")}</span>` : ""}</td><td>${statusBadge(p)}</td><td><a href="${mapUrl(p.lat, p.lng)}" target="_blank" rel="noopener">${t("open")}</a></td></tr>`).join("")}
      </tbody></table></div>` : `<p class="sub">${t("no_entries")}</p>`}`;
  };
  $("#ld").onclick = load;
  $("#csv").onclick = () => {
    if (!lastRows.length) return;
    const head = [t("date"), t("time"), t("employee"), t("action"), t("status"), t("distance") + " (m)", t("accuracy") + " (m)", t("latitude"), t("longitude"), t("phone")];
    const rows = lastRows.map(p => [fmtD(p.t), fmtT(p.t), p.emp, actionLabel(p.type), statusText(p), p.dist, p.acc, p.lat, p.lng, p.deviceId || ""]);
    const csv = [head, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
    a.download = `timeclock_${recF}_${recT}.csv`; a.click();
  };
  load();
}

function settingsPane() {
  const pane = $("#pane");
  pane.innerHTML = `<div class="set">
    <section><h3>${t("s_shop")}</h3>
      <label>${t("s_name")}<input id="sn" value="${esc(S.shopName)}"></label>
      <div class="row"><label>${t("latitude")}<input id="la" dir="ltr" value="${S.shop ? S.shop.lat : ""}"></label><label>${t("longitude")}<input id="lg" dir="ltr" value="${S.shop ? S.shop.lng : ""}"></label></div>
      <div><button id="here" class="btn">${t("use_loc")}</button> <span id="hm" class="sub small">${t("stand_inside")}</span></div>
      ${S.shop ? `<a href="${mapUrl(S.shop.lat, S.shop.lng)}" target="_blank" rel="noopener">${t("check_map")}</a>` : ""}
      <label>${t("radius")}<input id="rad" dir="ltr" type="number" min="20" max="2000" value="${S.radius}"></label>
      <label class="chk"><input type="checkbox" id="enf" ${S.enforce ? "checked" : ""}> ${t("enforce")}</label>
    </section>
    <section><h3>${t("s_lock")}</h3>
      <label class="chk"><input type="checkbox" id="dl" ${S.deviceLock ? "checked" : ""}> ${t("lock_lbl")}</label>
      <p class="sub small" style="margin:0">${t("lock_note")}</p>
      <div id="devs"><div class="spinner"></div></div></section>
    <section><h3>${t("s_emps")}</h3><p class="sub small" style="margin:0">${t("one_per_line")}</p>
      <textarea id="emps" dir="ltr" rows="10">${esc(S.employees.join("\n"))}</textarea></section>
    <section><h3>${t("s_pins")}</h3>
      <p class="sub small" style="margin:0">${t("pins_note")}</p>
      <div>${S.employees.map(e => `<div class="pinrow"><b class="ltr">${esc(e)}</b><span class="badge ${S.pins[e] ? "ok" : ""}">${S.pins[e] ? t("pin_set") : t("no_pin")}</span>
        <input data-p="${esc(e)}" dir="ltr" type="password" inputmode="numeric" placeholder="${t("new_pin")}" autocomplete="new-password">
        <label class="chk"><input type="checkbox" data-c="${esc(e)}"> ${t("remove")}</label></div>`).join("")}</div></section>
    <section><h3>${t("admin_pin")}</h3><input id="nap" dir="ltr" type="password" inputmode="numeric" placeholder="${t("new_admin_pin")}" autocomplete="new-password"></section>
    <button id="sv" class="big in">${t("save_settings")}</button><div id="msg"></div>
  </div>`;

  const renderDevs = async () => {
    const box = $("#devs"); if (!box) return;
    let all = {};
    try { all = await DB.allStatus(); } catch (e) { box.innerHTML = alertBox("err", t("phones_fail")); return; }
    box.innerHTML = S.employees.map(e => {
      const d = all[e]?.device;
      return `<div class="devrow"><b class="ltr">${esc(e)}</b><span>${d ? `<span class="badge ok">${t("phone")} ${shortDev(d)}</span>` : `<span class="badge">${t("not_reg")}</span>`}</span>
        ${d ? `<button class="ghost" data-r="${esc(e)}">${t("reset")}</button>` : "<span></span>"}</div>`;
    }).join("");
    box.querySelectorAll("[data-r]").forEach(b => b.onclick = async () => {
      if (!confirm(t("reset_confirm", { e: b.dataset.r }))) return;
      b.disabled = true;
      try { await DB.setDevice(b.dataset.r, null); } catch (e) { alert(t("reset_fail") + e.message); }
      renderDevs();
    });
  };
  renderDevs();

  $("#here").onclick = async () => {
    const hm = $("#hm"); hm.textContent = t("getting_loc");
    try { const c = await getPos(); $("#la").value = c.latitude.toFixed(6); $("#lg").value = c.longitude.toFixed(6);
      hm.textContent = t("got_loc", { a: Math.round(c.accuracy) }); }
    catch (e) { hm.textContent = e.message; }
  };

  $("#sv").onclick = async () => {
    const m = $("#msg");
    const lat = parseFloat($("#la").value), lng = parseFloat($("#lg").value), rad = parseInt($("#rad").value, 10);
    const emps = [...new Set($("#emps").value.split(/\r?\n/).map(s => s.trim().toUpperCase()).filter(Boolean))];
    if (($("#la").value || $("#lg").value) && (isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180)) { m.innerHTML = alertBox("err", t("bad_coords")); return; }
    if (!(rad >= 20 && rad <= 2000)) { m.innerHTML = alertBox("err", t("bad_radius")); return; }
    if (!emps.length) { m.innerHTML = alertBox("err", t("need_emp")); return; }

    const pins = { ...S.pins };
    for (const inp of pane.querySelectorAll("[data-p]")) {
      const e = inp.dataset.p, v = inp.value.trim();
      if (v) { if (v.length < 4) { m.innerHTML = alertBox("err", t("pin_short", { e: esc(e) })); return; } pins[e] = await sha(e + ":" + v); }
    }
    pane.querySelectorAll("[data-c]").forEach(c => { if (c.checked) delete pins[c.dataset.c]; });

    const nap = $("#nap").value.trim();
    if (nap && nap.length < 4) { m.innerHTML = alertBox("err", t("admin_short")); return; }

    const ns = { ...S, shopName: $("#sn").value.trim() || "Shop", shop: isNaN(lat) ? null : { lat, lng }, radius: rad, enforce: $("#enf").checked, deviceLock: $("#dl").checked, employees: emps, pins };
    if (nap) ns.adminHash = await sha("admin:" + nap);
    try { await DB.saveSettings(ns); S = ns; adminShell(); setTimeout(() => { const mm = $("#msg"); if (mm) mm.innerHTML = alertBox("ok", t("saved")); }, 50); }
    catch (e) { m.innerHTML = alertBox("err", t("save_err") + esc(e.message)); }
  };
}

boot();
</script>
</body>
</html>
