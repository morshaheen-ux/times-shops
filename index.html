<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Time Clock — Multi-Shop GPS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f7f9; color: #111; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 0 14px; }
  h1 { font-size: 19px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #ddd; margin-bottom: 16px; }
  .tab { padding: 8px 14px; background: none; border: none; cursor: pointer; color: #666; font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: #111; border-bottom-color: #111; font-weight: 500; }
  .msg { min-height: 22px; font-size: 14px; color: #555; margin-bottom: 10px; }
  .msg.err { color: #c0392b; }
  .msg.ok { color: #1e7e34; }
  .lbl { font-size: 13px; color: #888; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .5px; }
  .emp-grid, .shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .emp, .shop { padding: 12px 8px; border: 1px solid #ccc; border-radius: 10px; background: #fff; cursor: pointer; text-align: center; font-size: 14px; }
  .emp.sel, .shop.sel { background: #111; color: #fff; border-color: #111; font-weight: 600; }
  .actions { display: flex; gap: 10px; margin: 14px 0 12px; }
  .btn { flex: 1; padding: 16px; border-radius: 10px; border: 2px solid #ccc; background: #fff; cursor: pointer; font-size: 17px; font-weight: 600; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.in { border-color: #1e7e34; color: #1e7e34; }
  .btn.out { border-color: #c0392b; color: #c0392b; }
  .sec { background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 14px 16px; margin-bottom: 14px; }
  .sec h4 { margin: 0 0 10px; font-size: 15px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .small { font-size: 13px; color: #555; }
  .mini { padding: 7px 13px; border-radius: 8px; border: 1px solid #bbb; background: #fff; cursor: pointer; font-size: 13px; }
  .mini.primary { background: #111; color: #fff; border-color: #111; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: #888; font-weight: 500; padding: 6px 8px; border-bottom: 1px solid #ddd; white-space: nowrap; }
  td { padding: 6px 8px; border-bottom: 1px solid #eee; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .chip.in { background: #e2f4e8; color: #1e7e34; }
  .chip.out { background: #fbe4e1; color: #c0392b; }
  .chip.no { background: #eee; color: #666; }
  .chip.warn { background: #fdf3d7; color: #9a7b0a; }
  .chip.shop { background: #e8eefc; color: #274690; }
  .scroll { overflow-x: auto; }
  .num { width: 80px; padding: 7px 8px; border: 1px solid #bbb; border-radius: 8px; font-size: 13px; }
  .overlay { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: none; align-items: center; justify-content: center; z-index: 50; }
  .card { border: 1px solid #ddd; border-radius: 14px; padding: 30px 36px; text-align: center; background: #fff; }
  .card h3 { margin: 10px 0 6px; font-size: 20px; }
  .big { font-size: 32px; font-weight: 700; margin: 8px 0 2px; }
  .check { width: 56px; height: 56px; }
  input.pin { padding: 8px; border: 1px solid #bbb; border-radius: 8px; font-size: 14px; width: 120px; }
  .shopcard { border: 1px solid #e2e2e2; border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .shopcard b { font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Staff Time Clock</h1>
    <span class="small" id="syncBadge"></span>
  </header>

  <div class="tabs">
    <button class="tab active" id="tabEmp" onclick="showTab('emp')">Employee Clock</button>
    <button class="tab" id="tabAdm" onclick="showTab('adm')">Admin Center</button>
  </div>

  <!-- EMPLOYEE VIEW -->
  <div id="viewEmp">
    <div class="msg" id="shopInfo"></div>
    <div class="lbl">1 · Choose your shop</div>
    <div class="shop-grid" id="shopGrid"></div>
    <div class="lbl">2 · Choose your code</div>
    <div class="emp-grid" id="empGrid"></div>
    <div class="actions">
      <button class="btn in" id="btnIn" onclick="punch('in')" disabled>Time In</button>
      <button class="btn out" id="btnOut" onclick="punch('out')" disabled>Time Out</button>
    </div>
    <div class="msg" id="empMsg">Select your shop and employee code to enable the clock.</div>
  </div>

  <!-- ADMIN VIEW -->
  <div id="viewAdm" style="display:none">
    <div class="sec" id="pinGate">
      <h4>Admin access</h4>
      <div class="row">
        <input class="pin" type="password" id="pinInput" placeholder="Admin PIN" onkeydown="if(event.key==='Enter')checkPin()">
        <button class="mini primary" onclick="checkPin()">Unlock</button>
      </div>
      <div class="msg" id="pinMsg"></div>
    </div>

    <div id="admContent" style="display:none">
      <div class="sec">
        <h4>Shops & geofences</h4>
        <div class="small" style="margin-bottom:10px">Stand inside a shop and press its "Set to my GPS" button to define its location. Radius in meters.</div>
        <div id="shopCards"></div>
        <div class="msg" id="admMsg"></div>
      </div>

      <div class="sec">
        <h4>Team status today</h4>
        <div class="row" style="margin-bottom:8px" id="teamShopFilter"></div>
        <div class="scroll"><table id="teamTable"></table></div>
      </div>

      <div class="sec">
        <h4>Punch log</h4>
        <div class="row" style="margin-bottom:10px">
          <button class="mini" id="fltToday" onclick="setFilter('today')">Today</button>
          <button class="mini" id="fltAll" onclick="setFilter('all')">All records</button>
          <button class="mini primary" onclick="exportCSV()">Export CSV</button>
        </div>
        <div class="scroll"><table id="logTable"></table></div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="card">
      <svg class="check" viewBox="0 0 24 24" fill="none" stroke="#1e7e34" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-opacity=".3"/><path d="M8 12.5l2.5 2.5L16 9"/></svg>
      <h3 id="ovTitle"></h3>
      <div class="big" id="ovTime"></div>
      <p class="small" id="ovSub"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
/* ================= CONFIG ================= */
const ADMIN_PIN = "1234"; // <-- change this
const SHOP_NAMES = ["Wien", "Spandau", "Sonnenallee", "Bremen"];
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT"
};
/* ========================================== */

const EMPLOYEES = ["LUAB01","ALMO03","AHRA06","ABRE07","ALAH08","ALMU10","MOMO13","KHIB15","ALBA18","ABQA23"];
const LKEY = "tc_local_v2";
let db = null, cloud = false;
let punches = [], shops = {}, radius = 150;
let selShop = null, selected = null, filter = "today", busy = false, admOK = false, teamShop = "All";

try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    cloud = true;
    syncBadge.textContent = "Cloud sync ON";
    db.ref('shops').on('value', s => { shops = s.val() || {}; renderAll(); });
    db.ref('punches').on('value', s => { punches = Object.values(s.val() || {}); renderAll(); });
  }
} catch(e) { console.warn("Firebase failed, local mode", e); }

if (!cloud) {
  syncBadge.textContent = "Local mode (no cloud config)";
  const d = JSON.parse(localStorage.getItem(LKEY) || "{}");
  punches = d.punches || []; shops = d.shops || {};
}
function persistLocal(){ if(!cloud) localStorage.setItem(LKEY, JSON.stringify({punches, shops})); }

function showTab(t){
  viewEmp.style.display = t==='emp'?'block':'none';
  viewAdm.style.display = t==='adm'?'block':'none';
  tabEmp.classList.toggle('active', t==='emp');
  tabAdm.classList.toggle('active', t==='adm');
  if(t==='adm' && admOK) renderAdmin();
}
function checkPin(){
  if(pinInput.value === ADMIN_PIN){ admOK = true; pinGate.style.display='none'; admContent.style.display='block'; renderAdmin(); }
  else { pinMsg.className = "msg err"; pinMsg.textContent = "Wrong PIN."; }
}

function renderAll(){ renderEmpGrid(); if(admOK) renderAdmin(); }

function renderEmpGrid(){
  shopGrid.innerHTML = SHOP_NAMES.map(s =>
    `<button class="shop ${s===selShop?'sel':''}" onclick="pickShop('${s}')">${s}</button>`).join('');
  empGrid.innerHTML = EMPLOYEES.map(e =>
    `<button class="emp ${e===selected?'sel':''}" onclick="pick('${e}')">${e}</button>`).join('');
  const ready = selShop && selected;
  btnIn.disabled = !ready || busy;
  btnOut.disabled = !ready || busy;
  const set = shops[selShop];
  shopInfo.textContent = !selShop ? "Step 1: choose your shop."
    : set ? `${selShop} geofence active · radius ${set.radius || 150} m`
    : `${selShop} location not configured yet — ask admin.`;
}

function pickShop(s){
  selShop = s; selected = null;
  empMsg.className = "msg";
  empMsg.textContent = `${s} selected — now choose your employee code.`;
  renderEmpGrid();
}
function pick(e){
  selected = e;
  const last = punches.filter(p=>p.emp===e && p.shop===selShop).pop();
  empMsg.className = "msg";
  empMsg.textContent = last ? `${e} @ ${selShop} — last: ${last.type==='in'?'Time In':'Time Out'} at ${fmtT(last.ts)}` : `${e} @ ${selShop} selected.`;
  renderEmpGrid();
}

function getGPS(){
  return new Promise((res, rej) => {
    if(!navigator.geolocation) return rej("GPS not supported on this device.");
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, acc:Math.round(p.coords.accuracy)}),
      e => rej("GPS error: " + e.message),
      {enableHighAccuracy:true, timeout:12000, maximumAge:0});
  });
}
function distM(a,b){
  const R=6371000, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
  const h=Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

async function punch(type){
  if(!selShop || !selected || busy) return;
  const sh = shops[selShop];
  if(!sh){ empMsg.className="msg err"; empMsg.textContent = "Shop location not set — ask admin."; return; }
  busy = true; renderEmpGrid();
  empMsg.className = "msg"; empMsg.textContent = "Getting GPS fix…";
  let pos; try { pos = await getGPS(); } catch(e){
    busy=false; renderEmpGrid(); empMsg.className="msg err"; empMsg.textContent = e + " GPS is required."; return; }
  const d = Math.round(distM(pos, sh));
  const rad = sh.radius || 150;
  if(d > rad){
    busy=false; renderEmpGrid(); empMsg.className="msg err";
    empMsg.textContent = `You are ${d} m away from ${selShop} (limit ${rad} m). Are you at the right shop?`; return; }
  const last = punches.filter(p=>p.emp===selected && p.shop===selShop).pop();
  if(last && last.type === type){
    busy=false; renderEmpGrid(); empMsg.className="msg err";
    empMsg.textContent = `Already clocked ${type}. Use the other button.`; return; }
  const rec = {emp:selected, shop:selShop, type, ts:Date.now(), lat:+pos.lat.toFixed(6), lng:+pos.lng.toFixed(6), acc:pos.acc, dist:d};
  if(cloud) db.ref('punches').push(rec);
  else { punches.push(rec); persistLocal(); }
  busy = false; renderEmpGrid(); showOverlay(rec);
}

function showOverlay(rec){
  ovTitle.textContent = `${rec.emp} — ${rec.type==='in'?'Timed in':'Timed out'}`;
  ovTime.textContent = fmtT(rec.ts);
  ovSub.textContent = `${rec.shop} · ${rec.dist} m from shop center · GPS ±${rec.acc} m`;
  overlay.style.display = 'flex';
  setTimeout(() => { overlay.style.display='none'; pick(rec.emp); }, 3000);
}

/* ---------- ADMIN ---------- */
async function setShopGPS(name){
  admMsg.className="msg"; admMsg.textContent = `Getting GPS for ${name}…`;
  try {
    const p = await getGPS();
    const cur = shops[name] || {};
    const rad = Math.max(10, parseInt(document.getElementById('rad_'+name).value) || 150);
    const s = {lat:+p.lat.toFixed(6), lng:+p.lng.toFixed(6), radius:rad};
    if(cloud) await db.ref('shops/'+name).set(s);
    shops[name] = s; persistLocal();
    admMsg.className="msg ok"; admMsg.textContent = `${name} saved.`;
    renderAll();
  } catch(e){ admMsg.className="msg err"; admMsg.textContent = e; }
}
async function setRadius(name, v){
  v = Math.max(10, parseInt(v)||150);
  const s = shops[name]; if(!s) return;
  s.radius = v;
  if(cloud) await db.ref('shops/'+name).update({radius:v});
  persistLocal(); renderAll();
}

function fmtT(ts){ return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}); }
function dayKey(ts){ const d=new Date(ts); return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function hoursToday(emp, shopF){
  const tk = dayKey(Date.now());
  const ps = punches.filter(p=>p.emp===emp && dayKey(p.ts)===tk && (!shopF || p.shop===shopF));
  let ms=0;
  for(let i=0;i<ps.length-1;i++) if(ps[i].type==='in'&&ps[i+1].type==='out') ms += ps[i+1].ts-ps[i].ts;
  const h = ms/3600000;
  return h ? h.toFixed(2)+" h" : "—";
}

function renderAdmin(){
  shopCards.innerHTML = SHOP_NAMES.map(n=>{
    const s = shops[n];
    return `<div class="shopcard">
      <div class="row" style="justify-content:space-between">
        <div><b>${n}</b><br><span class="small">${s ? `Lat ${s.lat.toFixed(5)}, Lng ${s.lng.toFixed(5)}` : "Location not set"}</span></div>
        <div class="row">
          <input class="num" id="rad_${n}" type="number" min="10" step="10" value="${s?s.radius||150:150}" onchange="setRadius('${n}', this.value)">
          <span class="small">m</span>
          <button class="mini primary" onclick="setShopGPS('${n}')">Set to my GPS</button>
        </div>
      </div></div>`;
  }).join('');

  teamShopFilter.innerHTML = `<span class="small">Shop:</span>` +
    ["All",...SHOP_NAMES].map(s =>
      `<button class="mini ${s===teamShop?'primary':''}" onclick="teamShop='${s}';renderAdmin()">${s}</button>`).join('');

  const tk = dayKey(Date.now());
  teamTable.innerHTML = `<tr><th>Employee</th><th>Shop</th><th>Status</th><th>Last punch</th><th>Worked today</th><th>GPS check</th></tr>` +
    EMPLOYEES.map(e=>{
      const ps = punches.filter(p=>p.emp===e && dayKey(p.ts)===tk && (teamShop==="All"||p.shop===teamShop));
      const last = ps.pop();
      const sh = last ? shops[last.shop] : null;
      const rad = sh ? sh.radius||150 : 150;
      const st = !last ? '<span class="chip no">No punches</span>'
        : last.type==='in' ? '<span class="chip in">In shop</span>' : '<span class="chip out">Clocked out</span>';
      const loc = last ? (last.dist<=rad?'<span class="chip in">at shop</span>':`<span class="chip warn">${last.dist} m away</span>`) : '—';
      return `<tr><td><b>${e}</b></td><td>${last?`<span class="chip shop">${last.shop}</span>`:'—'}</td><td>${st}</td><td>${last?fmtT(last.ts):'—'}</td><td>${hoursToday(e, teamShop==="All"?null:teamShop)}</td><td>${loc}</td></tr>`;
    }).join('');

  fltToday.className = "mini" + (filter==='today' ? " primary" : "");
  fltAll.className = "mini" + (filter==='all' ? " primary" : "");
  const ps = (filter==='today' ? punches.filter(p=>dayKey(p.ts)===tk) : punches.slice()).reverse();
  logTable.innerHTML = `<tr><th>Date</th><th>Shop</th><th>Employee</th><th>Type</th><th>Time</th><th>GPS coords</th><th>Accuracy</th><th>Distance</th></tr>` +
    (ps.map(p=>`<tr><td>${new Date(p.ts).toLocaleDateString([],{month:'short',day:'numeric'})}</td><td><span class="chip shop">${p.shop}</span></td><td><b>${p.emp}</b></td><td><span class="chip ${p.type}">${p.type.toUpperCase()}</span></td><td>${fmtT(p.ts)}</td><td>${p.lat}, ${p.lng}</td><td>±${p.acc} m</td><td>${p.dist} m</td></tr>`).join('')
     || `<tr><td colspan="8" style="color:#999">No records yet.</td></tr>`);
}
function setFilter(f){ filter=f; renderAdmin(); }

function exportCSV(){
  const head = "date,shop,employee,type,time,lat,lng,accuracy_m,distance_from_shop_m\n";
  const body = punches.map(p=>[new Date(p.ts).toISOString().slice(0,10),p.shop,p.emp,p.type,new Date(p.ts).toTimeString().slice(0,8),p.lat,p.lng,p.acc,p.dist].join(",")).join("\n");
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([head+body],{type:'text/csv'}));
  a.download = "timeclock_punches.csv"; a.click();
}

renderEmpGrid();
</script>
</body>
</html>
